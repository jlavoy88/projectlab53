<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LAB53 — Coming Soon</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="LAB53 is a contemporary art space focused on the artistic practices of the Caribbean, Latin America, and their diasporas.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2300A99D'/%3E%3Ctext x='32' y='44' font-family='Poppins, sans-serif' font-weight='700' font-size='32' fill='white' text-anchor='middle'%3E53%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,440;1,9..144,440&family=Poppins:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root{
    --teal:#00A99D;
    --teal-700:#0E5951;
    --paper:#F3EFE3;
    --ink:#1A1712;
    --ink-soft:#5A5548;
    --font-display:'Fraunces', Georgia, serif;
    --font-body:'Poppins', -apple-system, sans-serif;
    --font-mono:'IBM Plex Mono', 'SFMono-Regular', monospace;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
  }
  .mark{
    display:inline-flex;
    align-items:center;
    gap:2px;
    font-family:var(--font-body);
    font-weight:700;
    font-size:clamp(2.4rem,7vw,3.6rem);
    letter-spacing:0.01em;
    color:var(--ink);
  }
  .mark .num{
    background:var(--teal);
    color:var(--paper);
    padding:0 0.16em;
    margin-left:0.06em;
    line-height:1.1;
  }
  .stamp{
    margin-top:28px;
    display:inline-block;
    font-family:var(--font-mono);
    font-size:0.72rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--teal-700);
    background:rgba(0,169,157,0.10);
    padding:6px 14px;
  }
  .quote{
    margin:32px 0 0;
    max-width:52ch;
    font-family:var(--font-display);
    font-style:italic;
    font-weight:400;
    font-size:clamp(1.2rem,3vw,1.55rem);
    line-height:1.5;
    color:var(--ink);
    text-wrap:balance;
  }
  .contact{
    margin-top:40px;
    display:flex;
    gap:22px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .contact a{
    font-family:var(--font-mono);
    font-size:0.78rem;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    text-decoration:none;
    border-bottom:1px solid transparent;
    transition:color .15s ease, border-color .15s ease;
  }
  .contact a:hover{
    color:var(--teal-700);
    border-color:var(--teal);
  }
  .foot{
    margin-top:56px;
    font-family:var(--font-mono);
    font-size:0.68rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    opacity:0.75;
  }
</style>
</head>
<body>

  <div class="mark">LAB<span class="num">53</span></div>

  <span class="stamp">Coming Soon</span>

  <p class="quote">&ldquo;A contemporary art space focused on the artistic practices of the Caribbean, Latin America, and their diasporas.&rdquo;</p>

  <div class="contact">
    <a href="mailto:hello@projectlab53.com">hello@projectlab53.com</a>
    <a href="https://instagram.com/project_lab53" target="_blank" rel="noopener">@project_lab53</a>
  </div>

  <div class="foot">Est. 2015</div>

</body>
</html>
